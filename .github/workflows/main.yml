name: Build UnFPK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # خطوة حاسمة لجلب أي مكاتب خارجية (Dependencies) يعتمد عليها الكود

    - name: Configure CMake
      # استخدام -S . لتأكيد مسار ملفات المصدر وتجنب أخطاء الضبط
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnFPK-Windows
        path: build/Release/*.exe
