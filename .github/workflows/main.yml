name: Build UnFPK with CMake

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      # تهيئة ملفات المشروع باستخدام CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      # ترجمة الكود وبناء الأداة (ملف exe)
      run: cmake --build build --config Release

    - name: Upload Executable Artifact
      # سحب الأداة الجاهزة ورفعها لتتمكن من تحميلها
      uses: actions/upload-artifact@v4
      with:
        name: UnFPK-Ready
        path: build/**/*.exe
